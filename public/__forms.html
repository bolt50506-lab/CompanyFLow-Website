<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>CompanyFlow form endpoint</title></head>
<body>
  <form name="project-enquiry" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="project-enquiry">
    <input name="bot-field">
    <input name="name">
    <input name="company">
    <input name="email">
    <input name="phone">
    <input name="industry">
    <input name="website">
    <input name="services">
    <textarea name="description"></textarea>
    <input name="budget">
  </form>
</body>
</html>
